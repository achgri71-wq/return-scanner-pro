<!doctype html>
<html lang="fr" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d18" />
    <meta
      name="description"
      content="Return Scanner Pro — validez les retours colis par liste, scan caméra ou douchette, hors ligne. Registre unique, statistiques et sauvegardes locales."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReturnScan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Return Scanner Pro</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('returnscanner.settings') || '{}');
        var theme = saved.theme || 'dark';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.lang = saved.lang || 'fr';
        document.documentElement.dir = saved.lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Return Scanner Pro nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
